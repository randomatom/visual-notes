<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用图解、动画和交互页面讲清数学、AI 与工程概念。">
  <title>可视化笔记 · Visual Notes</title>
  <link rel="icon" type="image/svg+xml" href="./assets/circle-square.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      line-height: 1.65;
      margin: 0;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 6rem) 1.5rem;
    }
    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.5rem); line-height: 1.15; }
    #refresh-site {
      min-height: 44px;
      padding: .35rem .8rem;
      border: 1px solid GrayText;
      border-radius: .5rem;
      background: Canvas;
      color: CanvasText;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>可视化笔记</h1>
      <button id="refresh-site" type="button" hidden>刷新站点</button>
    </header>
    <p>用图解、动画和交互页面讲清数学、AI 与工程概念。</p>
    <section aria-labelledby="bayes">
      <h2 id="bayes">贝叶斯概率</h2>
      <ul>
        <li><a href="./bayes/area-lab/">贝叶斯面积实验室</a>：拖动概率滑块，看先验、似然和后验如何对应图上的面积。</li>
        <li><a href="./bayes/weather-likelihood/">天气隔板：今天阴天，明天下雨吗？</a></li>
      </ul>
    </section>
    <section aria-labelledby="machine-learning">
      <h2 id="machine-learning">机器学习</h2>
      <ul>
        <li><a href="./machine-learning/confusion-matrix/">混淆矩阵与分类阈值</a>：看样本如何分流，以及阈值如何改变 PR 和 ROC 工作点。</li>
      </ul>
    </section>
  </main>
  <script>
    const pageURL = new URL(window.location.href);
    const refreshKey = 'refresh';
    const refreshToken = pageURL.searchParams.get(refreshKey);

    if (refreshToken) {
      const siteRoot = new URL('./', pageURL);
      for (const link of document.querySelectorAll('main section a[href]')) {
        const target = new URL(link.href);
        if (target.origin === siteRoot.origin && target.pathname.startsWith(siteRoot.pathname)) {
          target.searchParams.set(refreshKey, refreshToken);
          link.href = target.href;
        }
      }
    }

    const refreshButton = document.getElementById('refresh-site');
    refreshButton.addEventListener('click', () => {
      pageURL.searchParams.set(refreshKey, String(Date.now()));
      window.location.replace(pageURL.href);
    });
    refreshButton.hidden = false;
  </script>
</body>
</html>
